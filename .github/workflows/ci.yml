# GlobeGuard storefront - continuous integration.
#
# Quality gates only. This workflow never deploys, never talks to a running
# backend and needs no repository secrets. Deployment stays manual and is
# documented in the workspace docs/DEPLOY.md.
#
# The four gates and what each one proves are described in docs/CI.md.

name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch / pull request; a new push supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node 22 (the major the Dockerfile builds on)
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        env:
          # @playwright/test is a devDependency, but this workflow never runs the
          # end-to-end suite (see the commented job at the bottom), so the browser
          # download is dead weight here.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Generate Next.js route types
        # next-env.d.ts and .next/types/* are gitignored and both are pulled in by
        # tsconfig.json, so a clean checkout has neither. `next typegen` writes them
        # without a full build, which is what makes the typecheck below see the same
        # types a developer sees locally.
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      # The Playwright specs in e2e/ are excluded from the Next tsconfig and the suite itself is run manually against a live stack (see the disabled job below), so this is their only automated gate.
      - name: Typecheck (e2e)
        run: npx tsc --noEmit -p e2e/tsconfig.json

      - name: Lint
        run: npx eslint .

      - name: Unit tests (vitest)
        run: npm test

      - name: Build (next build, standalone output)
        env:
          # Baked into the client bundle at build time. CI only proves that the
          # build succeeds, so these are the .env.example development values and
          # never a real environment - the beta and production bundles are built
          # with their own NEXT_PUBLIC_SITE_URL (see docs/DEPLOY.md 4.6 and 4.9).
          NEXT_PUBLIC_SITE_NAME: GlobeGuard
          NEXT_PUBLIC_SITE_URL: http://localhost:3001
        run: npm run build

# ---------------------------------------------------------------------------
# End-to-end tests (Playwright) - deliberately not enabled.
#
